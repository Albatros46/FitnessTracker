spring.application.name=FitnessTrackerServer
# Server port
server.port=8036

# Database configuration (override with DB_URL / DB_USERNAME / DB_PASSWORD env variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Fitness_Tracker}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}

# JPA and Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# HikariCP Connection Pool settings (Optional)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# Angular dev server
app.cors.allowed-origins=http://localhost:4200
